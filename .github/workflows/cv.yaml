name: build - curriculum vitae

on:
  push:
    branches:
      - main
    paths:
      - 'cv/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'cv/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile biography PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex
          working_directory: cv
          args: '-xelatex -file-line-error -interaction=nonstopmode -synctex=1 -shell-escape'

      - name: Upload cv artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv/cv.pdf
          retention-days: 14
