name: build - bio

on:
  push:
    branches:
      - main
    paths:
      - 'biography/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'biography/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile biography PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: biography.tex
          working_directory: biography
          args: '-xelatex -file-line-error -interaction=nonstopmode -synctex=1 -shell-escape'

      - name: Upload biography artifact
        uses: actions/upload-artifact@v4
        with:
          name: biography-pdf
          path: biography/biography.pdf
          retention-days: 14
